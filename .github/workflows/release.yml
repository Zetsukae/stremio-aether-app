name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      service_version:
        description: 'stremio-service fork tag to build (e.g. v0.1.0-horizon.2)'
        required: true
        default: 'v0.1.0-horizon.2'

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/build/

  create-release:
    needs: build-web
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name=${{ github.ref_name }} \
            -f name=${{ github.ref_name }} \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            --jq '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}

  build-tauri:
    needs: [build-web, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x86_64-unknown-linux-gnu
            service-os: linux
            ext: ""
          - platform: windows-latest
            arch: x86_64-pc-windows-msvc
            service-os: windows
            ext: ".exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ${{ runner.temp }}/stremio-service

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev rpm

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - run: pnpm install

      - name: Clone stremio-service fork
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/stremio-service"
          git clone --depth 1 --branch "$SERVICE_VERSION" https://github.com/Aqu1tain/stremio-service "$RUNNER_TEMP/stremio-service"
        env:
          SERVICE_VERSION: ${{ inputs.service_version || 'v0.1.0-horizon.2' }}

      - name: Build stremio-service
        shell: bash
        run: |
          cd "$RUNNER_TEMP/stremio-service"
          cargo build --release --features bundled

      - name: Copy stremio-service binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp "$RUNNER_TEMP/stremio-service/target/release/stremio-service${{ matrix.ext }}" src-tauri/binaries/
          cp "$RUNNER_TEMP/stremio-service/resources/bin/${{ matrix.service-os }}"/* src-tauri/binaries/
          echo '{"type":"commonjs"}' > src-tauri/binaries/package.json
          chmod +x src-tauri/binaries/* 2>/dev/null || true
          ls -la src-tauri/binaries/

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: --target ${{ matrix.arch }}

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.exe

  publish-release:
    needs: [build-tauri, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        run: gh api repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release-id }} -X PATCH -F draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
