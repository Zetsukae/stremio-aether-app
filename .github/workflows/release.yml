name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      stream_server_version:
        description: 'perpetus/stream-server release tag to stage (e.g. v0.1.8)'
        required: true
        default: 'v0.1.8'

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/build/

  create-release:
    needs: build-web
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name=${{ github.ref_name }} \
            -f name=${{ github.ref_name }} \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            --jq '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}

  build-tauri:
    needs: [build-web, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x86_64-unknown-linux-gnu
            server-asset: stream-server-linux-amd64
            server-binary: stream-server
            ffmpeg-os: linux
            ffmpeg-files: ffmpeg ffprobe
          - platform: windows-latest
            arch: x86_64-pc-windows-msvc
            server-asset: stream-server-windows-amd64.exe
            server-binary: stream-server.exe
            ffmpeg-os: windows
            ffmpeg-files: ffmpeg.exe ffprobe.exe *.dll

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev rpm

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - run: pnpm install

      - name: Fetch stream-server
        shell: bash
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/stream-server"
          rm -rf "$DOWNLOAD_DIR"
          mkdir -p "$DOWNLOAD_DIR" src-tauri/binaries
          gh release download "$STREAM_SERVER_VERSION" --repo perpetus/stream-server \
            --pattern "$SERVER_ASSET" --pattern SHA256SUMS.txt --dir "$DOWNLOAD_DIR"
          (cd "$DOWNLOAD_DIR" && grep " $SERVER_ASSET\$" SHA256SUMS.txt | sha256sum -c -)
          cp "$DOWNLOAD_DIR/$SERVER_ASSET" "src-tauri/binaries/$SERVER_BINARY"
          chmod +x "src-tauri/binaries/$SERVER_BINARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STREAM_SERVER_VERSION: ${{ inputs.stream_server_version || 'v0.1.8' }}
          SERVER_ASSET: ${{ matrix.server-asset }}
          SERVER_BINARY: ${{ matrix.server-binary }}

      - name: Fetch ffmpeg and ffprobe
        shell: bash
        run: |
          set -euo pipefail
          FORK_DIR="$RUNNER_TEMP/stremio-service"
          rm -rf "$FORK_DIR"
          git clone --depth 1 --branch "$FFMPEG_FORK_TAG" --filter=blob:none --sparse \
            https://github.com/Aqu1tain/stremio-service "$FORK_DIR"
          git -C "$FORK_DIR" sparse-checkout set "resources/bin/$FFMPEG_OS"
          cd "$FORK_DIR/resources/bin/$FFMPEG_OS"
          cp $FFMPEG_FILES "$GITHUB_WORKSPACE/src-tauri/binaries/"
          ls -la "$GITHUB_WORKSPACE/src-tauri/binaries/"
        env:
          FFMPEG_FORK_TAG: v0.1.0-horizon.2
          FFMPEG_OS: ${{ matrix.ffmpeg-os }}
          FFMPEG_FILES: ${{ matrix.ffmpeg-files }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: --target ${{ matrix.arch }}

      - name: Repack Linux AppImage without bundled libwayland
        if: matrix.platform == 'ubuntu-22.04'
        run: scripts/repack-appimage.sh "$GITHUB_REF_NAME"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.arch }}/release/bundle/**/*.exe

  publish-release:
    needs: [build-tauri, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        run: gh api repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release-id }} -X PATCH -F draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
